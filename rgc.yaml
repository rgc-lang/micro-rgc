---
filetype: rgc
detect:
  filename: "\\.rg$"

rules:
  - comment: "#"
  - comment.block:
      start: "/\\*"
      end: "\\*/"
  - constant.string: "\"(\\.|[^\"\\\\])*\""
  - constant.number: "\\b(0[xX][0-9a-fA-F_]+|[0-9][0-9_]*([.][0-9][0-9_]*)?([eE][+-]?[0-9]+)?)\\b"
  - statement: "\\b(if|elif|else|for|in|while|break|continue|pass|return|match|case|from|public|def|class|enum|interface|import|and|or|not)\\b"
  - type: "\\b(int|float|bool|str)\\b"
  - preproc: "\\b(True|False|None)\\b"
  - special: "\\b(print|range|to_string|args|read_file|write_file|system|len)\\b"
  - special: "@var\\b|@[A-Za-z_][A-Za-z0-9_]*"
  - operator: "=>|->|==|!=|<=|>=|<<|>>|\\*\\*|//|\\+=|-=|\\*=|/=|=|<|>|\\+|-|\\*|/|%|&|\\||\\^|!"
  - identifier: "\\bself\\b"